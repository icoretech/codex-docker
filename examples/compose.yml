name: codex-docker-demo

x-codex-service: &codex-service
  image: ${CODEX_IMAGE:-ghcr.io/icoretech/codex-docker:latest}
  working_dir: /workspace
  environment:
    CODEX_HOME: /home/codex/.codex
  volumes:
    - codex_home:/home/codex/.codex
    - type: bind
      source: ./workspace
      target: /workspace

x-interactive-codex-service: &interactive-codex-service
  <<: *codex-service
  stdin_open: true
  tty: true

services:
  cli:
    <<: *interactive-codex-service
    profiles:
      - cli

  exec:
    <<: *interactive-codex-service
    profiles:
      - exec
    command:
      - exec
      - --skip-git-repo-check
      - --ephemeral
      - -C
      - /workspace
      - --help

  mcp:
    <<: *codex-service
    profiles:
      - mcp
    stdin_open: true
    command:
      - mcp-server

  remote-control:
    <<: *interactive-codex-service
    profiles:
      - remote-control
    command:
      - remote-control
      - start

  app-server-ws:
    <<: *interactive-codex-service
    profiles:
      - app-server-ws
    ports:
      - 127.0.0.1:4500:4500
    command:
      - app-server
      - --listen
      - ws://0.0.0.0:4500
      - --ws-auth
      - capability-token
      - --ws-token-sha256
      - a06a3642fee0991ee64f032f46306795f2bdcdb5396d5c887b37b0b120220328

  native-login-api-key:
    <<: *codex-service
    profiles:
      - native-login-api-key
    stdin_open: true
    command:
      - login
      - --with-api-key

  native-login-access-token:
    <<: *codex-service
    profiles:
      - native-login-access-token
    stdin_open: true
    command:
      - login
      - --with-access-token

  native-login-device:
    <<: *interactive-codex-service
    profiles:
      - native-login-device
    command:
      - login
      - --device-auth

  native-login-status:
    <<: *interactive-codex-service
    profiles:
      - native-login-status
    command:
      - login
      - status

  helper-login-api-key:
    <<: *codex-service
    profiles:
      - helper-login-api-key
    stdin_open: true
    environment:
      CODEX_HOME: /home/codex/.codex
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command:
      - codex-bootstrap
      - api-key-login

  helper-login-access-token:
    <<: *codex-service
    profiles:
      - helper-login-access-token
    stdin_open: true
    environment:
      CODEX_HOME: /home/codex/.codex
      CODEX_ACCESS_TOKEN: ${CODEX_ACCESS_TOKEN:-}
    command:
      - codex-bootstrap
      - access-token-login

  helper-login-device:
    <<: *interactive-codex-service
    profiles:
      - helper-login-device
    command:
      - codex-bootstrap
      - device-auth

  helper-status:
    <<: *interactive-codex-service
    profiles:
      - helper-status
    command:
      - codex-bootstrap
      - status

volumes:
  codex_home:
